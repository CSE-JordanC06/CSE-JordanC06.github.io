<!DOCTYPE html>
<html>
    <head>
        <title>Vacation Destinations</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <h1>Vacations</h1>
                <h2>Vacation Experiences</h2>
            </header>

            <main>
                <div id="vacation-gallery"></div>
            </main>

            <footer id="main-footer">
                <p>&copy; Jordan Chen</p>
            </footer>
        </div>

        <!-- Shared modal populated by the selected Vacation object -->
        <div id="vacation-modal" class="w3-modal">
            <div class="w3-modal-content" role="dialog"
                aria-modal="true" aria-labelledby="modal-title">
                <button id="close-modal" class="w3-button w3-display-topright"
                    aria-label="Close vacation details">&times;</button>

                <div id="modal-layout">
                    <iframe id="vacation-map" title="Vacation destination map"
                        allowfullscreen loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>

                    <section id="vacation-details"></section>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
