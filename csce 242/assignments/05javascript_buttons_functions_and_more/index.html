<!DOCTYPE html>
<html>
    <head>
        <title>Assignment 5</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <h1>Assignment 5</h1>
            </header>

            <main>
                <h2 id="page-title">Introduction to JavaScript</h2>

                <div class="projects">
                    <section id="speech-card" class="project-card">
                        <h3>Speech</h3>

                        <div id="speech-bubble" class="speech-bubble hidden">
                            Hi
                        </div>
                    </section>

                    <section class="project-card">
                        <h3>Beverage</h3>

                        <p class="beverage-choice">
                            <label for="beverage">Pick your morning beverage:</label>

                            <select id="beverage">
                                <option>Coffee</option>
                                <option>Orange Juice</option>
                                <option>Tea</option>
                                <option>Water</option>
                            </select>
                        </p>

                        <p id="beverage-message"></p>
                    </section>

                    <section class="project-card">
                        <h3>Add a Sticker</h3>

                        <div class="sun-container">
                            <img id="sun" src="images/sun.png" alt="Cartoon sun">
                            <span id="sticker" class="sticker hidden">☀️</span>
                        </div>
                    </section>
                </div>
            </main>

            <footer>
                <p>@jordanc06.github.io</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
